  header .wave{position:absolute;left:0;right:0;bottom:-1px;height:34px;display:block}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.9;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  header h1{font-size:26px;line-height:1.05;margin-top:6px;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.45)}

  main{max-width:620px;margin:0 auto;padding:14px 16px 40px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;cursor:pointer;
    display:flex;align-items:center;gap:11px;transition:transform .12s ease;box-shadow:0 1px 0 rgba(16,38,47,.04);min-height:60px}
  .tile:active{transform:scale(.97)}
  .tile .ic{font-size:23px;line-height:1;flex:0 0 auto}
  .tile .nm{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .tile.full{grid-column:1 / -1;gap:13px;background:linear-gradient(100deg,#b4412e,#cc5a44);color:#fff;border:none;min-height:54px;box-shadow:0 2px 10px rgba(180,65,46,.28)}
  .tile.full .nm{font-size:16px}
  .tile.full .arrow{margin-left:auto;opacity:.85}

  .detail{display:none;animation:fade .22s ease}
  .detail.active{display:block}
  .overview.hidden{display:none}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .back{display:inline-flex;align-items:center;gap:9px;background:var(--teal);border:none;color:#fff;
    font-size:15.5px;font-weight:700;cursor:pointer;padding:12px 20px 12px 16px;border-radius:14px;
    margin-bottom:16px;box-shadow:0 2px 10px rgba(29,106,126,.28);transition:transform .12s ease,background .12s}
  .back:active{transform:scale(.96);background:var(--deep)}
  .back .chev{font-size:18px;line-height:1}
  .detail .head{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
  .detail .head .ic{font-size:34px}
  .detail .head h2{font-size:25px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .body{font-size:16.5px;line-height:1.55;white-space:pre-wrap;color:#1d3640}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin-bottom:14px}
  .warn{background:var(--warn-bg);border:1px solid rgba(180,65,46,.25);border-radius:16px;padding:16px 18px;margin-top:4px}
  .warn .tag{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .warn .body{color:#7d2c1e}

  .links{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .linkbtn{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;
    transition:transform .12s ease,border-color .12s}
  .linkbtn:active{transform:scale(.98);border-color:var(--teal)}
  .linkbtn .go{margin-left:auto;color:var(--teal);font-weight:700}

  .wlan{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .wlan .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sand);border-radius:14px;padding:14px 16px}
  .wlan .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
  .wlan .val{font-size:18px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .copy{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .copy:active{transform:scale(.95)}
  .copy.done{background:var(--reed)}

  ul.check{list-style:none;display:flex;flex-direction:column}
  ul.check li{display:flex;gap:14px;align-items:flex-start;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  ul.check li:last-child{border-bottom:none}
  .box{flex:0 0 24px;height:24px;border:2px solid var(--surface);border-radius:7px;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .box svg{width:15px;height:15px;opacity:0;transition:opacity .15s}
  li.on .box{background:var(--reed);border-color:var(--reed)}
  li.on .box svg{opacity:1}
  li.on .ctext{color:var(--muted);text-decoration:line-through}
  .ctext{font-size:16px;line-height:1.45;padding-top:1px}
  .reset{margin-top:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:11px;width:100%;font-size:14px;font-weight:600;cursor:pointer}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 30px}

Nach dem Überqueren der Schwalm die Ausfahrt Niederkrüchten/Brüggen/Wassenberg ausfahren.

2 km später dem Schild Dülken/Schwalmtal/Hariksee nach rechts folgen.

Kurz nach der Mühlrather Mühle / Fischzucht Hariksee geht es direkt nach der Schwalm im sehr spitzen Winkel nach rechts in den Harikseeweg.

Nicht direkt am Parkplatz der Mühlrather Mühle parken, sondern immer links halten, bis nach ein paar Hundert Metern rechts ein Parkplatz erscheint – schon am Ufer. Dort parken, es gibt keine weiteren Parkmöglichkeiten.

const ov=document.getElementById('overview'),dt=document.getElementById('detail');
document.getElementById('hausName').textContent=HAUS.name;
document.getElementById('hausSub').textContent=HAUS.untertitel;
document.getElementById('footer').textContent=HAUS.name+" \u00b7 sch\u00f6ne Zeit am See \u26f5";
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function buildOverview(){
  ov.innerHTML='<div class="grid"></div>';const grid=ov.querySelector('.grid');
  KAPITEL.forEach(k=>{const full=k.id==='abfahrt';const el=document.createElement('div');
    el.className='tile'+(full?' full':'');
    el.innerHTML=full?'<span class="ic">'+k.icon+'</span><span class="nm">'+k.titel+' \u00b7 Checkliste</span><span class="arrow">\u2192</span>':'<span class="ic">'+k.icon+'</span><span class="nm">'+k.titel+'</span>';
    el.onclick=()=>openDetail(k.id);grid.appendChild(el);});
}
function openDetail(id){
  const k=KAPITEL.find(x=>x.id===id);
  let html='<button class="back" onclick="closeDetail()"><span class="chev">\u2190</span> Zur\u00fcck zur \u00dcbersicht</button><div class="head"><span class="ic">'+k.icon+'</span><h2>'+k.titel+'</h2></div>';
  if(k.checkliste){
    html+='<ul class="check">';
    k.checkliste.forEach(c=>{html+='<li onclick="this.classList.toggle(\'on\')"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span><span class="ctext">'+esc(c)+'</span></li>';});
    html+='</ul><button class="reset" onclick="resetCheck()">Alle zur\u00fccksetzen</button>';
  }else{
    html+='<div class="card"><div class="body">'+esc(k.text)+'</div>';
    if(k.wlan){html+='<div class="wlan"><div class="row"><div><div class="lbl">Netzwerk</div><div class="val">'+esc(k.wlan.ssid)+'</div></div><button class="copy" onclick="copyVal(this,\''+esc(k.wlan.ssid)+'\')">Kopieren</button></div><div class="row"><div><div class="lbl">Passwort</div><div class="val">'+esc(k.wlan.pw)+'</div></div><button class="copy" onclick="copyVal(this,\''+esc(k.wlan.pw)+'\')">Kopieren</button></div></div>';}
    html+='</div>';
    if(k.links){html+='<div class="links">';k.links.forEach(l=>{html+='<a class="linkbtn" href="'+l.url+'" target="_blank" rel="noopener">'+esc(l.label)+'<span class="go">\u2197</span></a>';});html+='</div>';}
    if(k.warnung){html+='<div class="warn"><span class="tag">\u26a0 Achtung</span><div class="body">'+esc(k.warnung)+'</div></div>';}
  }
  dt.innerHTML=html;dt.classList.add('active');ov.classList.add('hidden');window.scrollTo(0,0);
}
function closeDetail(){dt.classList.remove('active');ov.classList.remove('hidden');window.scrollTo(0,0);}
function resetCheck(){dt.querySelectorAll('.check li').forEach(li=>li.classList.remove('on'));}
function copyVal(btn,val){try{navigator.clipboard.writeText(val);}catch(e){}const old=btn.textContent;btn.textContent='Kopiert \u2713';btn.classList.add('done');setTimeout(()=>{btn.textContent=old;btn.classList.remove('done');},1400);}
buildOverview();
</script>
